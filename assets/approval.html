<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="{{csp}}">
  <link rel="stylesheet" href="{{hljsCss}}">
  <style>
    body { font-family: var(--vscode-font-family); color: var(--vscode-foreground); background: var(--vscode-editor-background); margin: 0; padding: 16px; }
    h1 { font-size: 13px; font-weight: 600; margin: 0 0 12px; color: var(--vscode-descriptionForeground); text-transform: uppercase; letter-spacing: 0.05em; }
    pre { background: var(--vscode-textCodeBlock-background, var(--vscode-editor-background)); border: 1px solid var(--vscode-panel-border); border-radius: 4px; padding: 12px; overflow: auto; margin: 0; }
    code { font-family: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, monospace); font-size: var(--vscode-editor-font-size, 13px); line-height: 1.5; white-space: pre; tab-size: 2; }
    .bar { position: sticky; bottom: 0; margin-top: 16px; padding: 12px 0 0; background: var(--vscode-editor-background); border-top: 1px solid var(--vscode-panel-border); display: flex; gap: 8px; }
    button { font-family: inherit; font-size: 13px; padding: 6px 14px; border: 1px solid var(--vscode-button-border, transparent); border-radius: 2px; cursor: pointer; }
    .primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
    .primary:hover { background: var(--vscode-button-hoverBackground); }
    .secondary { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
    .secondary:hover { background: var(--vscode-button-secondaryHoverBackground); }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <h1>Agent script requesting execution in the extension host</h1>
  <pre><code class="language-javascript">{{code}}</code></pre>
  <div class="bar">
    <button class="primary" id="run" autofocus>Run</button>
    <button class="secondary" id="trust">Run + trust session</button>
    <div class="spacer"></div>
    <button class="secondary" id="deny">Deny</button>
  </div>
  <script src="{{hljsJs}}"></script>
  <script>
    hljs.highlightAll();
    const vscode = acquireVsCodeApi();
    const send = a => vscode.postMessage({ action: a });
    document.getElementById('run').onclick = () => send('run');
    document.getElementById('trust').onclick = () => send('trust');
    document.getElementById('deny').onclick = () => send('deny');
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') send('deny');
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send('run');
    });
    document.getElementById('run').focus();
  </script>
</body>
</html>
